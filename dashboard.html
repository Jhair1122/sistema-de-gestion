<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel · Bodega+</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar__marca">Bodega<span>+</span></div>
      <nav class="sidebar__nav">
        <a href="/dashboard.html" data-nav="dashboard">Panel</a>
        <a href="/productos.html" data-nav="productos">Productos</a>
        <a href="/clientes.html" data-nav="clientes">Clientes</a>
        <a href="/ventas.html" data-nav="ventas">Ventas</a>
        <a href="/inventario.html" data-nav="inventario">Inventario</a>
        <a href="/reportes.html" data-nav="reportes">Reportes</a>
      </nav>
      <button class="sidebar__salir" data-logout type="button">Cerrar sesión</button>
    </aside>

    <div class="app-content">
      <header class="app-topbar">
        <h1>Panel</h1>
        <span class="app-topbar__usuario">Hola, <strong data-usuario-nombre>—</strong></span>
      </header>

      <main class="app-main">
        <div class="mensaje-error oculto" data-error></div>

        <div class="resumen-fila">
          <div class="resumen-celda">
            <span class="etiqueta">Ventas de hoy</span>
            <span class="cifra nums" data-ventas-hoy-total>S/ 0.00</span>
          </div>
          <div class="resumen-celda">
            <span class="etiqueta">Ventas del mes</span>
            <span class="cifra nums" data-ventas-mes-total>S/ 0.00</span>
          </div>
          <div class="resumen-celda">
            <span class="etiqueta">Productos activos</span>
            <span class="cifra nums" data-total-productos>0</span>
          </div>
          <div class="resumen-celda">
            <span class="etiqueta">Con stock bajo</span>
            <span class="cifra nums alerta" data-stock-bajo>0</span>
          </div>
          <div class="resumen-celda">
            <span class="etiqueta">Clientes activos</span>
            <span class="cifra nums" data-total-clientes>0</span>
          </div>
        </div>

        <section class="seccion">
          <div class="seccion-cabecera">
            <h2>Ventas recientes</h2>
            <a class="boton boton--fantasma boton--pequeno" href="/ventas.html">Ver todas</a>
          </div>
          <div class="tabla-envoltorio">
            <table>
              <thead>
                <tr>
                  <th>Fecha</th>
                  <th class="num">Total</th>
                  <th>Estado</th>
                </tr>
              </thead>
              <tbody data-tabla-recientes>
                <tr class="tabla-vacia"><td colspan="3">Cargando…</td></tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
