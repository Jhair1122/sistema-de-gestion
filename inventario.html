<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventario · Bodega+</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar__marca">Bodega<span>+</span></div>
      <nav class="sidebar__nav">
        <a href="/dashboard.html" data-nav="dashboard">Panel</a>
        <a href="/productos.html" data-nav="productos">Productos</a>
        <a href="/clientes.html" data-nav="clientes">Clientes</a>
        <a href="/ventas.html" data-nav="ventas">Ventas</a>
        <a href="/inventario.html" data-nav="inventario">Inventario</a>
        <a href="/reportes.html" data-nav="reportes">Reportes</a>
      </nav>
      <button class="sidebar__salir" data-logout type="button">Cerrar sesión</button>
    </aside>

    <div class="app-content">
      <header class="app-topbar">
        <h1>Inventario</h1>
        <span class="app-topbar__usuario">Hola, <strong data-usuario-nombre>—</strong></span>
      </header>

      <main class="app-main">
        <div class="mensaje-error oculto" data-error></div>
        <div class="mensaje-exito oculto" data-exito></div>

        <div class="resumen-fila">
          <div class="resumen-celda">
            <span class="etiqueta">Productos activos</span>
            <span class="cifra nums" data-total-productos>0</span>
          </div>
          <div class="resumen-celda">
            <span class="etiqueta">Con stock bajo</span>
            <span class="cifra nums alerta" data-total-bajo>0</span>
          </div>
          <div class="resumen-celda">
            <span class="etiqueta">Agotados</span>
            <span class="cifra nums alerta" data-total-agotado>0</span>
          </div>
        </div>

        <section class="seccion">
          <div class="seccion-cabecera">
            <h2>Estado del stock</h2>
            <button class="boton solo-admin" type="button" data-abrir-movimiento>Registrar movimiento</button>
          </div>
          <div class="tabla-envoltorio">
            <table>
              <thead>
                <tr><th>Producto</th><th class="num">Stock</th><th class="num">Stock mínimo</th><th>Estado</th></tr>
              </thead>
              <tbody data-tabla-stock>
                <tr class="tabla-vacia"><td colspan="4">Cargando…</td></tr>
              </tbody>
            </table>
          </div>
        </section>

        <section class="seccion">
          <h2>Movimientos recientes</h2>
          <div class="tabla-envoltorio">
            <table>
              <thead>
                <tr><th>Fecha</th><th>Producto</th><th>Tipo</th><th class="num">Cantidad</th><th class="num">Stock resultante</th><th>Motivo</th></tr>
              </thead>
              <tbody data-tabla-movimientos>
                <tr class="tabla-vacia"><td colspan="6">Cargando…</td></tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <dialog data-dialogo-movimiento>
    <form class="dialogo-cuerpo" method="dialog" id="form-movimiento">
      <h2>Registrar movimiento</h2>
      <div class="campo">
        <label for="m-producto">Producto</label>
        <select id="m-producto" name="producto_id" required></select>
      </div>
      <div class="campo">
        <label for="m-tipo">Tipo</label>
        <select id="m-tipo" name="tipo" required>
          <option value="ENTRADA">Entrada (compra / reposición)</option>
          <option value="SALIDA">Salida (merma, uso interno)</option>
          <option value="AJUSTE">Ajuste (fijar stock exacto)</option>
        </select>
      </div>
      <div class="campo">
        <label for="m-cantidad" data-etiqueta-cantidad>Cantidad</label>
        <input type="number" id="m-cantidad" name="cantidad" min="1" step="1" required />
      </div>
      <div class="campo">
        <label for="m-motivo">Motivo (opcional)</label>
        <input type="text" id="m-motivo" name="motivo" />
      </div>
      <div class="dialogo-acciones">
        <button class="boton boton--fantasma" type="button" data-cerrar-movimiento>Cancelar</button>
        <button class="boton" type="submit">Guardar</button>
      </div>
    </form>
  </dialog>

  <script src="/js/api.js"></script>
  <script src="/js/inventario.js"></script>
</body>
</html>
