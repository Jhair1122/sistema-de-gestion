<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión · Bodega+</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <main class="auth-pantalla">
    <div class="auth-tarjeta">
      <h1>Bienvenido de vuelta</h1>
      <p class="subtitulo">Ingresa con tu correo y contraseña.</p>

      <div class="mensaje-error oculto" data-error></div>

      <form id="form-login" novalidate>
        <div class="campo">
          <label for="email">Correo</label>
          <input type="email" id="email" name="email" autocomplete="email" required />
        </div>
        <div class="campo">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required />
        </div>
        <button class="boton" type="submit" style="width:100%">Ingresar</button>
      </form>

      <p class="auth-pie">
        ¿No tienes una cuenta? <a href="/register.html">Registra tu negocio</a>
      </p>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
