<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión · Bodega+</title>
  <link rel="icon" href="/img/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="fondo-liquido" aria-hidden="true"><span class="b1"></span><span class="b2"></span><span class="b3"></span></div>

  <main class="auth-pantalla">
    <div class="auth-tarjeta">
      <div class="marca">Bodega<span>+</span></div>
      <h1>Bienvenido de vuelta</h1>
      <p class="subtitulo-seccion">Ingresa con el correo y la contraseña de tu negocio.</p>

      <div class="mensaje-error oculto" data-error></div>

      <form id="form-login" novalidate>
        <div class="campo">
          <label for="email">Correo</label>
          <input type="email" id="email" name="email" autocomplete="email" required />
        </div>
        <div class="campo">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required />
        </div>
        <button class="boton" type="submit" style="width:100%">Ingresar</button>
      </form>

      <p class="auth-pie">
        ¿No tienes una cuenta? <a href="/register.html">Registra tu negocio</a>
      </p>
    </div>
  </main>

  <script src="/js/ui.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
