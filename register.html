<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear negocio · Bodega+</title>
  <link rel="icon" href="/img/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="fondo-liquido" aria-hidden="true"><span class="b1"></span><span class="b2"></span><span class="b3"></span></div>

  <main class="auth-pantalla">
    <div class="auth-tarjeta">
      <div class="marca">Bodega<span>+</span></div>
      <h1>Registra tu negocio</h1>
      <p class="subtitulo-seccion">Esto crea tu negocio y tu cuenta como administrador, con acceso completo desde el primer momento.</p>

      <div class="mensaje-error oculto" data-error></div>

      <form id="form-register" novalidate>
        <div class="campo">
          <label for="nombre_negocio">Nombre del negocio</label>
          <input type="text" id="nombre_negocio" name="nombre_negocio" required />
        </div>
        <div class="campo">
          <label for="ruc">RUC (opcional)</label>
          <input type="text" id="ruc" name="ruc" />
        </div>
        <div class="campo">
          <label for="nombre_completo">Tu nombre completo</label>
          <input type="text" id="nombre_completo" name="nombre_completo" required />
        </div>
        <div class="campo">
          <label for="email">Correo</label>
          <input type="email" id="email" name="email" autocomplete="email" required />
        </div>
        <div class="campo">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required />
          <small>Mínimo 8 caracteres.</small>
        </div>
        <button class="boton" type="submit" style="width:100%">Crear negocio</button>
      </form>

      <p class="auth-pie">
        ¿Ya tienes cuenta? <a href="/login.html">Inicia sesión</a>
      </p>
    </div>
  </main>

  <script src="/js/ui.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
